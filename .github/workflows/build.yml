name: Build plugin
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: VaultRestocker-jar
          path: target/VaultRestocker-*.jar
